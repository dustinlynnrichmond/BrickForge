name: BrickForge Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Android project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android project not added yet; no APK can be built."
          fi
      - uses: actions/setup-java@v4
        if: steps.project.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.project.outputs.present == 'true'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.project.outputs.present == 'true'
        with:
          gradle-version: '8.10.2'
      - name: Install icon rendering dependency
        if: steps.project.outputs.present == 'true'
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate 3D brick icons and mapping files
        if: steps.project.outputs.present == 'true'
        run: python3 tools/generate_brick_icons.py
      - name: Upload icon coverage report
        if: steps.project.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: brickforge-icon-report
          path: icon-report.json
      - name: Build debug APK
        if: steps.project.outputs.present == 'true'
        run: |
          gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: steps.project.outputs.present == 'true'
        with:
          name: brickforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
